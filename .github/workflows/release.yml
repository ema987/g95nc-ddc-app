name: Release

# Push a tag like v1.2.3 (or publish a release with a new tag from GitHub's UI) to build installers
# for every OS and attach them to that GitHub Release. The tag is the only source of the version.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: windows-latest
            label: windows-x64
          # Pinned rather than ubuntu-latest: jpackage takes the .deb/.rpm dependency package names from
          # the build machine, so an older LTS keeps the packages installable on more distros.
          - os: ubuntu-24.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Native installers only accept a plain MAJOR.MINOR.PATCH, and macOS requires MAJOR > 0.
      - name: Read version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3 (MAJOR > 0)"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build installers
        run: ./gradlew packageDistributionForCurrentOS -PappVersion="$APP_VERSION" --console=plain

      # Every runner names its output "G95NC Controller-<version>.<ext>", so the two macOS builds
      # would collide - rename to a URL-friendly name that also says which OS/arch it's for.
      - name: Collect installers
        shell: bash
        run: |
          mkdir dist
          find build/compose/binaries/main -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \) | while read -r f; do
            cp "$f" "dist/G95NC-Controller-$APP_VERSION-${{ matrix.label }}.${f##*.}"
          done
          ls -l dist

      # Portable build for distros that can't (easily) install .deb/.rpm, e.g. immutable ones like
      # Bazzite/Silverblue/SteamOS: the same self-contained app folder the packages are made from.
      - name: Collect portable Linux archive
        if: runner.os == 'Linux'
        run: |
          ./gradlew createDistributable -PappVersion="$APP_VERSION" --console=plain
          cp packaging/linux/install.sh packaging/linux/start-on-login.sh "build/compose/binaries/main/app/G95NC Controller/"
          tar -C build/compose/binaries/main/app \
            --transform "s|^G95NC Controller|G95NC-Controller-$APP_VERSION|" \
            -czf "dist/G95NC-Controller-$APP_VERSION-${{ matrix.label }}.tar.gz" "G95NC Controller"
          tar -tzf "dist/G95NC-Controller-$APP_VERSION-${{ matrix.label }}.tar.gz" | grep '/lib/libapplauncher.so$' > /dev/null
          tar -tzf "dist/G95NC-Controller-$APP_VERSION-${{ matrix.label }}.tar.gz" | grep '/install.sh$' > /dev/null
          tar -tzf "dist/G95NC-Controller-$APP_VERSION-${{ matrix.label }}.tar.gz" | grep '/start-on-login.sh$' > /dev/null
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      # Release notes come from this version's CHANGELOG.md section ("## [1.2.3] - date" up to the
      # next "## ["); without one, GitHub generates notes from the commits instead.
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ -s notes.md ]; then cat notes.md; else echo "No CHANGELOG.md section for $GITHUB_REF_NAME"; fi

      # A release drafted in GitHub's UI already exists by the time its tag triggers this - attach
      # to it (keeping the notes written there); a plain tag push has no release yet, so create one.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
